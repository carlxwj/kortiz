name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and static tests
        run: node --test tests/*.test.js
      - name: Check for obvious secrets
        run: python3 scripts/scan-secrets.py
